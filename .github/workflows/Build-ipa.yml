name: Build nxnative IPA

on:
  workflow_dispatch:
    inputs:
      nsp_url:
        description: 'Direct Download URL to Game NSP/XCI File'
        required: true
        type: string

jobs:
  build:
    runs-on: macos-14 # Apple Silicon runner

    steps:
      - name: Checkout nxnative repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Clean up disk space
        run: |
          sudo rm -rf /Library/Developer/CommandLineTools

      - name: Select Active Xcode Version
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Set up Homebrew & Python dependencies
        run: |
          brew install xcodegen zstd spirv-cross glslang
          python3 -m pip install --break-system-packages lz4 capstone fonttools "backports.zstd; python_version < '3.14'"

      - name: Restore prod.keys from Secret
        run: |
          mkdir -p ~/keys
          echo "${{ secrets.PROD_KEYS_BASE64 }}" | base64 -d > ~/keys/prod.keys
          
          if [ ! -s ~/keys/prod.keys ]; then
            echo "Error: prod.keys is empty or failed to decode!"
            exit 1
          fi

      - name: Download Game File
        run: |
          mkdir -p ~/Games/GameFolder
          curl -L "${{ inputs.nsp_url }}" -o ~/Games/GameFolder/game.nsp

      - name: Regenerate Shader Chain Headers
        run: |
          # dmsh_chain.h must hold the chain version the current sources produce; the committed ones are
          # stale, so rewrite every profile's header (the build checks the game's own).
          for f in dm/games/*/game.tsv; do
            DM_GAME="$(basename "$(dirname "$f")")" python3 dm/gfx/tools/dmsh_chain.py --header
          done

      - name: Build IPA
        env:
          PATH: /opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/dm
        run: |
          python3 scripts/build_ipa_from_nsp.py ~/Games/GameFolder -k ~/keys/prod.keys -o ~/GameBuild.ipa

      - name: Show build logs on failure
        if: failure()
        run: |
          shopt -s nullglob
          xcrun -sdk macosx metal --version || true
          xcrun -sdk iphoneos metal --version || true
          spirv-cross --version || true
          for f in ~/Games/GameFolder/*_build/logs/*.log; do
            echo "===== $f (last 200 lines) ====="
            tail -n 200 "$f"
          done
          for d in ~/Games/GameFolder/*_build/shader/cache/b-* ~/Games/GameFolder/*_build/shader/ios/b-*; do
            echo "===== $d ====="
            ls -la "$d" | head -20
          done
          for j in ~/Games/GameFolder/*_build/shader/cache/b-*/_b_build.json; do
            echo "===== $j ====="
            python3 -c "import json,collections,sys; r=json.load(open(sys.argv[1])); print(*collections.Counter((x['st'], x['err'][:160]) for x in r).most_common(10), sep='\n')" "$j"
          done

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: ~/Games/GameFolder/*_build/logs/
          if-no-files-found: ignore

      - name: Upload IPA Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: game-ipa
          path: ~/GameBuild.ipa
