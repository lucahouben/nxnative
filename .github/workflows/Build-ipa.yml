name: Build nxnative IPA

on:
  workflow_dispatch:
    inputs:
      nsp_url:
        description: 'Direct Download URL to Game NSP/XCI File'
        required: true
        type: string

jobs:
  build:
    runs-on: macos-14 # Apple Silicon cloud runner

    steps:
      - name: Checkout nxnative repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Set up Homebrew & Python dependencies
        run: |
          brew install xcodegen zstd spirv-cross glslang
          python3 -m pip install --break-system-packages lz4 capstone fonttools "backports.zstd; python_version < '3.14'"

      - name: Restore prod.keys from Secret
        run: |
          mkdir -p ~/keys
          echo "${{ secrets.PROD_KEYS }}" > ~/keys/prod.keys

      - name: Download Game File
        run: |
          mkdir -p ~/Games/GameFolder
          curl -L "${{ inputs.nsp_url }}" -o ~/Games/GameFolder/game.nsp

      - name: Build IPA
        env:
          PATH: /opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/dm
        run: |
          # 1. Detect game Title ID from extracted NSP directory or survey
          # 2. Force dmsh_chain.py to write dmsh_chain.h with DM_GAME set
          
          python3 -c "
          import glob, re, os, subprocess

          # Find game directory
          build_dirs = glob.glob('/Users/runner/Games/GameFolder/*_build')
          if build_dirs:
              title_id = os.path.basename(build_dirs[0]).replace('_build', '')
              print(f'Detected Title ID: {title_id}')
              env = os.environ.copy()
              env['DM_GAME'] = title_id
              subprocess.run(['python3', 'dm/gfx/tools/dmsh_chain.py', '--header'], env=env)
          " || true

          # 3. Execute the standard build script
          python3 scripts/build_ipa_from_nsp.py ~/Games/GameFolder -k ~/keys/prod.keys -o ~/GameBuild.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: game-ipa
          path: ~/GameBuild.ipa
